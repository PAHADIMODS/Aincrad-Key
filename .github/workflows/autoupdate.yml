 name: Human-Like Browser Auto-Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  browser-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Selenium & Chrome Drivers
        run: |
          pip install selenium webdriver-manager

      - name: Run Human Simulation Script
        run: |
          python - <<EOF
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          options = Options()
          options.add_argument("--headless")
          options.add_argument("--disable-gpu")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36")

          driver = webdriver.Chrome(options=options)
          
          try:
              print("Opening site as a human...")
              driver.get("https://aincradmods.com/getkey")
              
              # Thoda wait karenge taakin page poora human ki tarah load ho jaye aur JS/Cloudflare pass ho jaye
              time.sleep(5)
              
              current_url = driver.current_url
              print(f"Current Browser URL: {current_url}")

              # Page ka source code uthayenge jisme final link/token hoga
              page_source = driver.page_source
              
              import re
              token_match = re.search(r'token=([a-zA-Z0-9]{32})', page_source)
              
              if token_match:
                  token = token_match.group(1)
                  final_link = f"https://aincradmods.com/getkey?token={token}"
              else:
                  # Agar URL me token mil gaya
                  if "token=" in current_url:
                      final_link = current_url
                  else:
                      final_link = "https://aincradmods.com/getkey"

              print(f"Extracted Working Link: {final_link}")

              with open("Pahadi.txt", "w") as f:
                  f.write(final_link)

          except Exception as e:
              print(f"Error during browser run: {e}")
              exit(1)
          finally:
              driver.quit()
          EOF

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Pahadi Browser Bot"
          git config --global user.email "bot@pahadimods.com"
          git add Pahadi.txt
          git commit -m "Auto-Synced: Updated via Headless Browser" || exit 0
          git push
